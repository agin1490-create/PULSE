<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>PULSE PRO</title>
<meta name="theme-color" content="#0b0c0e"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<style>
:root{--bg:#0b0c0e;--sf:#121317;--el:#181a1f;--fg:#ecece8;--mu:#8b8d93;--su:#5c5e66;--up:#8fbf9a;--dn:#d08989;--wn:#c4b184;--ac:#d5d7dc;--btc:#c4a574;--eth:#8aa0c4;--xau:#b8a078}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.w{max-width:512px;margin:0 auto;min-height:100dvh;padding:18px 20px 96px}
.mo{font-family:ui-monospace,Menlo,monospace}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
h1{font-size:22px;font-weight:500;margin:2px 0 0;letter-spacing:-.02em}
.k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mu);margin:0}
.sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-top:4px}
.tape{display:flex;gap:12px;overflow:auto;padding-bottom:16px;scrollbar-width:none}
.ch{min-width:118px;flex:0 0 auto;background:var(--sf);border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px #ffffff14}
.cd,.th{background:var(--sf);border-radius:24px;padding:16px;margin-bottom:10px;box-shadow:0 0 0 1px #ffffff14}
.th{border-radius:18px;padding:14px;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:512px;margin:0 auto;background:#0b0c0ee6;border-top:1px solid #ffffff14;padding:8px 12px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;backdrop-filter:blur(8px)}
.nav button{min-height:44px;border-radius:12px;font-size:10px;letter-spacing:.08em;color:var(--mu)}.nav button.on{background:var(--el);color:var(--fg)}
.se{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin:18px 0 10px}
.mu{color:var(--mu)}.su{color:var(--su)}.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--wn)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bt{min-height:40px;width:100%;border-radius:12px;background:var(--ac);color:#0b0c0e;font-size:13px;font-weight:500;margin-top:12px}
.sg{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.sg button{min-height:36px;border-radius:999px;padding:0 12px;font-size:12px;color:var(--mu);box-shadow:0 0 0 1px #ffffff14}.sg button.on{background:var(--ac);color:#0b0c0e}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.d1{width:6px;height:6px;border-radius:50%;display:inline-block}
.st{background:var(--bg);border-radius:12px;padding:8px;box-shadow:0 0 0 1px #ffffff10}.st .a{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}.st .b{font-size:13px;margin-top:2px;font-family:ui-monospace,Menlo,monospace}
.pi{border-radius:10px;padding:4px 10px;font-size:11px;font-weight:500}
.gd{border-radius:6px;padding:2px 6px;font-size:10px;font-family:ui-monospace,Menlo,monospace}
.bar{height:4px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
svg.sp{width:100%;height:32px;margin-top:12px}
</style>
</head>
<body>
<div class="w">
  <div class="hd">
    <div>
      <p class="k mo">Terminal · v12</p>
      <h1>PULSE PRO</h1>
      <p class="sub mo">India desk →</p>
    </div>
    <div class="mo" style="font-size:10px;color:var(--mu);margin-top:6px"><span class="dot" id="dot"></span> <span id="feed">idle</span></div>
  </div>
  <div class="tape" id="tape"></div>
  <div id="view"><p class="mu">Loading…</p></div>
</div>
<nav class="nav">
  <button class="on" data-t="desk">Desk</button>
  <button data-t="setup">Setup</button>
  <button data-t="news">News</button>
  <button data-t="log">Log</button>
</nav>
<script src="engine.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
