.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.stat .v{font-size:13px;margin-top:2px}
.badge{border-radius:6px;padding:2px 6px;font-size:10px}
.pill{border-radius:10px;padding:4px 10px;font-size:11px;font-weight:500}

.nav button.on{background:var(--elev);color:var(--fg)}

.muted{color:var(--muted)} .subtle{color:var(--subtle)} .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{min-height:44px;width:100%;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:500;margin-top:10px}
.btn.ghost{background:var(--elev);color:var(--muted)}
.seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg button{min-height:40px;border-radius:999px;padding:0 16px;font-size:12px;color:var(--muted);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.seg button.on{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.bar{height:4px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
input{width:100%;min-height:42px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:0 12px;font:inherit}
svg.spark{width:100%;height:32px;margin-top:10px}
</style>

    if (j.ok && j.price) { S.live.xau.price = j.price; S.live.xau.chg = j.chg24 || 0; S.live.xau.spark = S.live.xau.spark.concat(j.price).slice(-60); return; }
  } catch (e) {}
  try {
    var r = await fetch("https://api.gold-api.com/price/XAU");
    var g = await r.json();
    if (g.price) { S.live.xau.price = g.price; S.live.xau.spark = S.live.xau.spark.concat(g.price).slice(-60); }
  } catch (e2) {}
}
async function refreshNews() {
  try {
    var j = await proxyJson("/news");
    if (Array.isArray(j) && j.length) { S.news = j.map(function (n) { return { source: n.source, title: n.title, time: n.time, tags: n.coins || n.tags || [] }; }); return; }
  } catch (e) {}
  try {
    var url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent("https://www.coindesk.com/arc/outboundfeeds/rss/");
    var j2 = await fetch(url).then(function (r) { return r.json(); });
    S.news = (j2.items || []).slice(0, 16).map(function (it) {
      var title = it.title || "", tags = [], t = title.toLowerCase();
      if (t.indexOf("btc") >= 0 || t.indexOf("bitcoin") >= 0) tags.push("BTC");
      if (t.indexOf("eth") >= 0 || t.indexOf("ethereum") >= 0) tags.push("ETH");
      if (t.indexOf("gold") >= 0 || t.indexOf("xau") >= 0) tags.push("XAU");
      if (t.indexOf("fed") >= 0 || t.indexOf("cpi") >= 0 || t.indexOf("nfp") >= 0) tags.push("MACRO");
      return { source: "CoinDesk", title: title, time: "", tags: tags };
    });
  } catch (e2) { S.news = []; }
}
async function refreshWorld() {
  try { var j = await proxyJson("/markets"); if (Array.isArray(j)) S.world = j; } catch (e) { S.world = []; }
}
async function analyseOne(id, mode) {
  var m = MODES[mode];
  var execC = await loadKlines(id, m.exec);
  var ctxC = await loadKlines(id, m.ctx);
  var midC = await loadKlines(id, m.mid);
  var a = analyze(execC, ctxC, midC, S.live[id].price || undefined);
  var gs = goldOk();
  var s = ASSETS.filter(function (x) { return x.id === id; })[0];
  var gate = qualityGate(a, { isGold: s.gold, goldOk: gs.ok, regime: S.live[id].regime });
  return { a: a, gate: gate };
}
async function refreshSignals() {
  S.goldLabel = goldOk().label;
  S.sessions = sessions();
  await Promise.all(ASSETS.map(async function (s) {
    try { S.sig[s.id] = await analyseOne(s.id, "m5"); } catch (e) {}
  }));
  paint();
}
function logSetup(id, pack) {
  var a = pack.a, g = pack.gate;
  if (!a.dir || a.entry == null) return;
  var s = ASSETS.filter(function (x) { return x.id === id; })[0];
  S.journal.unshift({ id: "j" + Date.now(), ts: Date.now(), sym: s.sym, market: id, side: a.dir, entry: a.entry, sl: a.sl, tp: a.tp, score: a.score, grade: g.grade, status: "OPEN", r: null });
  saveJ(); S.tab = "log"; paint();
}
function paintTape() {
  document.getElementById("tape").innerHTML = ASSETS.map(function (s) {
    var st = S.live[s.id], up = (st.chg || 0) >= 0;
    return h(
      '<div class="chip"><div class="row"><span class="dot" style="background:', s.color, '"></span><span class="mono" style="font-size:10px;color:var(--muted)">', s.sym, "</span></div>",
      '<div class="mono" style="font-size:15px;margin-top:4px">', fmt(st.price), "</div>",
      '<div class="mono ', up ? "up" : "down", '" style="font-size:11px">', up ? "+" : "", (st.chg || 0).toFixed(2), "%</div></div>"
    );
  }).join("");
  var d = document.getElementById("dot");
  d.style.background = S.status === "live" ? "var(--up)" : S.status === "err" ? "var(--down)" : "var(--subtle)";
  document.getElementById("feed").textContent = S.status === "live" ? S.feed : S.status === "err" ? "reconnect" : "idle";
}
function gradeBadge(g) {
  var c = g === "A" ? "up" : g === "B" ? "warn" : "muted";
  return h('<span class="badge mono" style="background:rgba(255,255,255,.06);color:var(--', c, ')">', g, "</span>");
}
function stats3(a) {
  return h(
    '<div class="grid3" style="margin-top:10px">',
    '<div class="stat mono"><div class="k">Score</div><div class="v">', a.score, "</div></div>",
    '<div class="stat mono"><div class="k">RSI</div><div class="v">', a.rsi.toFixed(1), "</div></div>",
    '<div class="stat mono"><div class="k">R:R</div><div class="v">', a.rr != null ? a.rr.toFixed(2) : "-", "</div></div></div>"
  );
}
function newsCard(n, feat) {
  var tags = (n.tags || []).map(function (t) { return h('<span class="badge mono muted" style="background:var(--elev);margin-right:4px">', t, "</span>"); }).join("");
  return h(
    '<article class="thumb"><div class="row mono muted" style="font-size:10px"><span>', n.source || "", "</span><span>", n.time || "", "</span></div>",
    '<p style="margin:6px 0 0;font-size:', feat ? "15px" : "13px", ";", feat ? "" : "color:var(--muted)", '">', n.title, "</p>",
    tags ? h('<div style="margin-top:8px">', tags, "</div>") : "", "</article>"
  );
}
function viewDesk() {
  var important = S.news.filter(function (n) { return (n.tags || []).length; }).slice(0, 3);
  var cards = ASSETS.map(function (s) {
    var pack = S.sig[s.id], st = S.live[s.id], path = spark(st.spark), up = (st.chg || 0) >= 0;
    if (!pack) return h('<article class="card"><div class="row"><b>', s.name, '</b><span class="mono">', fmt(st.price), '</span></div><p class="muted" style="margin:10px 0 0">Reading closed structure...</p></article>');
    var a = pack.a, gate = pack.gate, take = gate.pass, lng = take && a.dir === "long";
    var sparkSvg = path ? h('<svg class="spark" viewBox="0 0 140 32" preserveAspectRatio="none"><path d="', path, '" fill="none" stroke="', up ? "var(--up)" : "var(--down)", '" stroke-width="1.4"/></svg>') : "";
    var pillBg = lng ? "rgba(143,191,154,.15)" : take ? "rgba(208,137,137,.15)" : "var(--elev)";
    var pillFg = lng ? "var(--up)" : take ? "var(--down)" : "var(--muted)";
    var msg = take ? gate.grade + " setup. HTF " + a.trendC + " · mid " + a.trendM + ". SL " + fmt(a.sl) + " · TP " + fmt(a.tp) + "." : "Stand down. " + gate.reasons.slice(0, 2).join(" · ") + ".";
    return h(
      '<article class="card"><div class="row"><div><b>', s.name, "</b> ", gradeBadge(gate.grade),
      '<div class="mono muted" style="font-size:11px;margin-top:2px">', fmt(st.price), " · ", st.regime, s.gold ? " · " + S.goldLabel : "", "</div></div>",
      '<span class="pill" style="background:', pillBg, ";color:", pillFg, '">', take ? (a.dir === "long" ? "BUY" : "SELL") : "WAIT", "</span></div>",
      sparkSvg, stats3(a),
      '<p class="muted" style="font-size:13px;line-height:1.35;margin:12px 0 0">', msg, "</p>",
      take ? h('<button class="btn" data-log="', s.id, '">Log setup</button>') : "",
      "</article>"
    );
  }).join("");
  var thumbs = S.sessions.map(function (v) {
    var idx = null;
    for (var i = 0; i < S.world.length; i++) if (S.world[i].name === v.idx) idx = S.world[i];
    return h(
      '<div class="thumb"><div class="row"><b>', v.name, '</b><span class="dot" style="background:', v.open ? "var(--up)" : "var(--subtle)", '"></span></div>',
      '<div class="mono muted" style="font-size:11px;margin-top:4px">', v.city, "</div>",
      '<div class="row" style="margin-top:8px"><span class="mono" style="font-size:16px">', v.clock, '</span><span class="mono" style="font-size:10px;color:', v.open ? "var(--up)" : "var(--muted)", '">', v.label, "</span></div>",
      idx ? h('<div class="mono" style="font-size:11px;margin-top:8px;color:', idx.chg >= 0 ? "var(--up)" : "var(--down)", '">', idx.name, " ", idx.chg >= 0 ? "+" : "", idx.chg.toFixed(2), "%</div>") : "",
      "</div>"
    );
  }).join("");
  var news = important.length ? important.map(function (n) { return newsCard(n, true); }).join("") : '<p class="muted">Headlines load in a few seconds.</p>';
  var openN = S.sessions.filter(function (x) { return x.open; }).length;
  return h(
    '<p class="sec mono"><span>Judgment · BTC ETH XAU</span></p>', cards,
    '<p class="subtle" style="font-size:11px;line-height:1.45">A = 88 / R:R 2 / HTF+mid / closed reversal. B = 78 / 1.8. Against HTF is WAIT.</p>',
    '<p class="sec mono"><span>World openings</span><span>', openN, " open</span></p>",
    '<div class="grid2">', thumbs, "</div>",
    '<p class="sec mono"><span>Important news</span></p>', news
  );
}
function viewSetup() {
  var pack = S.setup;
  var segs = ASSETS.map(function (s) { return h("<button data-sid='", s.id, "' class='", S.setupId === s.id ? "on" : "", "'>", s.sym, "</button>"); }).join("");
  var modes = h(
    "<button data-mode='m5' class='", S.mode === "m5" ? "on" : "", "'>5m / 1h</button>",
    "<button data-mode='m15' class='", S.mode === "m15" ? "on" : "", "'>15m / 4h</button>"
  );
  if (!pack) return h('<p class="sec mono">Setup analyser</p><div class="seg">', segs, '</div><div class="seg">', modes, '</div><p class="muted">Reading closed candles...</p>');
  var a = pack.a, gate = pack.gate;
  var circ = 2 * Math.PI * 30, off = circ * (1 - (a.score || 0) / 100);
  var parts = a.parts.map(function (row) {
    return h('<div style="margin-bottom:10px"><div class="row" style="font-size:12px"><span>', row[0], '</span><span class="mono muted">', row[1], "/", row[2], '</span></div><div class="bar"><i style="width:', (row[1] / row[2]) * 100, "%;background:", row[1] === row[2] ? "var(--up)" : row[1] === 0 ? "var(--subtle)" : "var(--accent)", '"></i></div></div>');
  }).join("");
  var plan = "";
  if (a.dir) {
    var rows = [["Entry", fmt(a.entry)], ["Stop", fmt(a.sl)], ["Target", fmt(a.tp)], ["R:R", a.rr ? a.rr.toFixed(2) : "-"]];
    plan = h('<div class="card">', rows.map(function (kv) { return h('<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px"><span class="muted">', kv[0], '</span><span class="mono">', kv[1], "</span></div>"); }).join(""), "</div>");
  }
  return h(
    '<p class="sec mono">Setup analyser</p><div class="seg">', segs, '</div><div class="seg">', modes, "</div>",
    '<div class="card" style="display:flex;gap:16px;align-items:center"><div style="position:relative;width:72px;height:72px">',
    '<svg width="72" height="72" style="transform:rotate(-90deg)"><circle cx="36" cy="36" r="30" stroke="rgba(255,255,255,.08)" stroke-width="6" fill="none"/><circle cx="36" cy="36" r="30" stroke="', a.score >= 78 ? "var(--up)" : "var(--warn)", '" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="', circ, '" stroke-dashoffset="', off, '"/></svg>',
    '<div class="mono" style="position:absolute;inset:0;display:grid;place-items:center;font-size:18px">', a.score, "</div></div>",
    '<div><div class="mono" style="font-size:12px;color:', gate.pass ? "var(--up)" : "var(--muted)", '">', gate.pass ? gate.grade + " SETUP · " + (a.dir || "").toUpperCase() : "STAND DOWN", "</div>",
    '<p class="muted" style="font-size:13px;margin:6px 0 0">', gate.pass ? "Take only if this matches your plan. R:R " + (a.rr || 0).toFixed(2) + "." : gate.reasons.slice(0, 3).join(" · "), "</p></div></div>",
    '<div class="card"><p class="mono muted" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px">Confluence</p>', parts, "</div>",
    plan,
    '<button class="btn ghost" id="rerun">Re-analyse</button>',
    gate.pass ? h('<button class="btn" data-log="', S.setupId, '">Log this setup</button>') : "",
    '<p class="subtle" style="font-size:11px;margin-top:12px">Aid only - last closed candle, never the forming bar.</p>'
  );
}
function viewNews() {
  var imp = S.news.filter(function (n) { return (n.tags || []).length; });
  var rest = S.news.filter(function (n) { return !(n.tags || []).length; });
  return h(
    '<p class="sec mono">Important · BTC ETH XAU MACRO</p>',
    imp.length ? imp.map(function (n) { return newsCard(n, true); }).join("") : h('<p class="muted">', S.news.length ? "No tagged headlines." : "Loading headlines...", "</p>"),
    rest.length ? h('<p class="sec mono">Tape</p>', rest.slice(0, 12).map(function (n) { return newsCard(n); }).join("")) : ""
  );
}
function viewLog() {
  var closed = S.journal.filter(function (j) { return j.status !== "OPEN" && j.r != null; });
  var wins = closed.filter(function (j) { return (j.r || 0) > 0; });
  var wr = closed.length ? wins.length / closed.length : 0;
  var avg = closed.length ? closed.reduce(function (a, b) { return a + (b.r || 0); }, 0) / closed.length : 0;
  var open = S.journal.filter(function (j) { return j.status === "OPEN"; }).length;
  var rows = S.journal.slice(0, 40).map(function (j) {
    return h(
      '<article class="thumb"><div class="row"><div><b>', j.sym, '</b> <span class="mono muted" style="font-size:11px">', j.side.toUpperCase(), '</span><div class="mono muted" style="font-size:11px">', j.grade, " · score ", j.score, "</div></div>",
      '<span class="mono" style="color:', j.status === "TP" ? "var(--up)" : j.status === "SL" ? "var(--down)" : "var(--muted)", '">',
      j.status === "OPEN" ? "OPEN" : j.status + " " + ((j.r || 0) >= 0 ? "+" : "") + (j.r || 0).toFixed(2) + "R", "</span></div>",
      '<p class="mono muted" style="font-size:12px;margin:8px 0 0">', fmt(j.entry), " · SL ", fmt(j.sl), " · TP ", fmt(j.tp), "</p>",
      j.status === "OPEN" ? h('<div class="row" style="margin-top:10px;gap:6px"><button class="btn" style="background:rgba(143,191,154,.15);color:var(--up)" data-close="', j.id, '" data-st="TP">Hit TP</button><button class="btn" style="background:rgba(208,137,137,.15);color:var(--down)" data-close="', j.id, '" data-st="SL">Hit SL</button><button class="btn ghost" data-close="', j.id, '" data-st="BE">BE</button></div>') : "",
      "</article>"
    );
  }).join("");
  return h(
    '<p class="sec mono">Signal journal</p>',
    '<div class="grid3" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:12px">',
    '<div class="stat mono"><div class="k">Closed</div><div class="v">', closed.length, "</div></div>",
    '<div class="stat mono"><div class="k">Win rate</div><div class="v">', closed.length ? Math.round(wr * 100) + "%" : "-", "</div></div>",
    '<div class="stat mono"><div class="k">Expect.</div><div class="v">', closed.length ? avg.toFixed(2) + "R" : "-", "</div></div>",
    '<div class="stat mono"><div class="k">Open</div><div class="v">', open, "</div></div></div>",
    S.journal.length ? rows : '<div class="card" style="text-align:center"><b>No logged setups</b><p class="muted" style="margin:6px 0 0">When Desk shows A or B, tap Log setup.</p></div>'
  );
}
function paint() {
  paintTape();
  var v = document.getElementById("view");
  v.innerHTML = S.tab === "desk" ? viewDesk() : S.tab === "setup" ? viewSetup() : S.tab === "news" ? viewNews() : viewLog();
  var buttons = document.querySelectorAll(".nav button");
  for (var i = 0; i < buttons.length; i++) buttons[i].classList.toggle("on", buttons[i].getAttribute("data-tab") === S.tab);
}
document.querySelector(".nav").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  S.tab = b.getAttribute("data-tab");
  if (S.tab === "setup") runSetup();
  paint();
});
document.getElementById("view").addEventListener("click", function (e) {
  var log = e.target.closest("[data-log]");
  if (log) { var id = log.getAttribute("data-log"); var pack = id === S.setupId && S.setup ? S.setup : S.sig[id]; if (pack) logSetup(id, pack); return; }
  var sid = e.target.closest("[data-sid]"); if (sid) { S.setupId = sid.getAttribute("data-sid"); runSetup(); return; }
  var md = e.target.closest("[data-mode]"); if (md) { S.mode = md.getAttribute("data-mode"); runSetup(); return; }
  if (e.target.id === "rerun") { runSetup(); return; }
  var cl = e.target.closest("[data-close]");
  if (cl) {
    var jid = cl.getAttribute("data-close"), st = cl.getAttribute("data-st");
    for (var i = 0; i < S.journal.length; i++) {
      if (S.journal[i].id !== jid) continue;
      var risk = Math.abs(S.journal[i].entry - S.journal[i].sl) || 1e-9;
      if (st === "TP") { S.journal[i].status = "TP"; S.journal[i].r = Math.abs(S.journal[i].tp - S.journal[i].entry) / risk; }
      else if (st === "SL") { S.journal[i].status = "SL"; S.journal[i].r = -1; }
      else { S.journal[i].status = "BE"; S.journal[i].r = 0; }
    }
    saveJ(); paint();
  }
});
async function runSetup() { S.setup = null; paint(); try { S.setup = await analyseOne(S.setupId, S.mode); } catch (e) {} paint(); }
function connectWS() {
  function apply(id, px, qty, sell) {
    var st = S.live[id];
    st.price = px;
    st.spark = st.spark.concat(px).slice(-60);
    var signed = (sell ? -qty : qty) * px;
    st.delta = st.delta * 0.86 + signed;
    if (st.spark.length > 20) {
      var r = [];
      for (var i = 1; i < st.spark.length; i++) { var a0 = st.spark[i - 1]; if (a0 > 0) r.push((st.spark[i] - a0) / a0); }
      var mean = r.reduce(function (x, y) { return x + y; }, 0) / r.length;
      var vol = Math.sqrt(r.reduce(function (x, y) { return x + (y - mean) * (y - mean); }, 0) / r.length) * 100;
      st.regime = vol < 0.04 ? "SQUEEZE" : vol > 0.12 ? "EXPANSION" : "TREND";
    }
    paintTape();
  }
  var streams = ASSETS.filter(function (a) { return !a.gold; }).map(function (a) { return a.binance.toLowerCase() + "@aggTrade/" + a.binance.toLowerCase() + "@ticker"; }).join("/");
  var bybit = false, ws;
  function bybitConnect() {
    bybit = true;
    ws = new WebSocket("wss://stream.bybit.com/v5/public/spot");
    ws.onopen = function () {
      S.feed = "Bybit"; S.status = "live"; paintTape();
      var args = [];
      ASSETS.forEach(function (a) { if (!a.gold) { args.push("publicTrade." + a.bybit); args.push("tickers." + a.bybit); } });
      ws.send(JSON.stringify({ op: "subscribe", args: args }));
    };
    ws.onclose = function () { S.status = "err"; paintTape(); };
    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data), topic = msg.topic || "", data = msg.data;
      var spec = ASSETS.filter(function (a) { return topic.indexOf("." + a.bybit) >= 0; })[0];
      if (!spec || !data) return;
      if (topic.indexOf("publicTrade") === 0) {
        (Array.isArray(data) ? data : [data]).forEach(function (t) { apply(spec.id, +t.p, +t.v, String(t.S).toLowerCase() === "sell"); });
      } else if (topic.indexOf("tickers") === 0) {
        var t = Array.isArray(data) ? data[0] : data;
        S.live[spec.id].price = +t.lastPrice; S.live[spec.id].chg = +t.price24hPcnt * 100; paintTape();
      }
    };
  }
  try { ws = new WebSocket("wss://stream.binance.com:9443/stream?streams=" + streams); } catch (e) { bybitConnect(); return; }
  ws.onopen = function () { S.feed = "Binance"; S.status = "live"; paintTape(); };
  ws.onerror = function () { if (!bybit) { try { ws.close(); } catch (e2) {} bybitConnect(); } };
  ws.onclose = function () { if (!bybit) { S.status = "err"; paintTape(); } };
  ws.onmessage = function (ev) {
    var msg = JSON.parse(ev.data), d = msg.data, stream = msg.stream || "";
    var spec = ASSETS.filter(function (a) { return stream.indexOf(a.binance.toLowerCase()) === 0; })[0];
    if (!spec || !d) return;
    if (stream.indexOf("@aggTrade") >= 0) apply(spec.id, +d.p, +d.q, !!d.m);
    else if (stream.indexOf("@ticker") >= 0) { S.live[spec.id].price = +d.c; S.live[spec.id].chg = +d.P; paintTape(); }
  };
}
(async function boot() {
  try {
    S.sessions = sessions(); S.goldLabel = goldOk().label; paint();
    connectWS();
    await Promise.all(ASSETS.map(async function (s) {
      try {
        var rows = await loadKlines(s.id, "1m");
        var last = rows[rows.length - 1] && rows[rows.length - 1].c;
        var open = rows[0] && rows[0].o;
        S.live[s.id].price = last;
        S.live[s.id].chg = open ? ((last - open) / open) * 100 : 0;
        S.live[s.id].spark = rows.map(function (k) { return k.c; }).slice(-60);
      } catch (e) {}
    }));
    paint();
    refreshGold(); refreshNews(); refreshWorld().then(paint);
    await refreshSignals();
    setInterval(refreshSignals, 60000);
    setInterval(function () { S.sessions = sessions(); S.goldLabel = goldOk().label; if (S.tab === "desk") paint(); }, 30000);
    setInterval(refreshGold, 20000);
  } catch (e) {
    document.getElementById("view").innerHTML = h('<p class="down">', String(e.message || e), "</p>");
  }
})();
</script>
