    --mono:'JetBrains Mono',ui-monospace,monospace;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--disp);overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;}
  #app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:radial-gradient(120% 60% at 50% -10%, #16121f 0%, var(--bg) 55%);}

  .brand h1{font-size:17px;font-weight:600;letter-spacing:.5px;margin:0;}
  .brand .sub{font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:1px;}
  .status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted2);}
  .dot.live{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite;}
  .dot.err{background:var(--red);box-shadow:0 0 10px var(--red);}
  .dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .gear{background:none;border:none;color:var(--muted);font-size:18px;padding:6px;cursor:pointer;}
  .tape{flex:0 0 auto;display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:6px 18px 12px;border-bottom:1px solid var(--line);}
  .tape::-webkit-scrollbar{display:none;}
  .tape-item{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;}
  .tape-sym{font-size:10px;color:var(--muted);letter-spacing:1px;}
  .tape-px{font-family:var(--mono);font-size:13px;font-weight:500;}
  .tape-chg{font-family:var(--mono);font-size:10px;}
  .up{color:var(--green);} .down{color:var(--red);}
  .body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 90px;scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  .view{display:none;} .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
